services:
  fdroid:
    build: .
    env_file: .env
    environment:
      DATA_DIR: /data
      PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    restart: unless-stopped

  # One-shot full clean + publish against the same data volume:
  #   docker compose --profile publish run --rm publish
  publish:
    profiles: ["publish"]
    build: .
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
    entrypoint: ["scripts/publish.sh"]
