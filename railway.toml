# Railway config — same start path as local Docker (scripts/start.sh).
# Attach a persistent volume with mount path /data:
#   railway volume add --mount-path /data

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# start.sh always syncs config from env; rebuilds repo if env fingerprint changed
startCommand = "bash scripts/start.sh"
#healthcheckPath = "/health"
#healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
